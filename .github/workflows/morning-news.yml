name: 朝のニュース便

on:
  schedule:
    # 毎日 6:50 JST（= 21:50 UTC）。GitHub の混雑で実際の起動は数分〜数十分遅れることがある
    - cron: "50 21 * * *"
  # Actions 画面の「Run workflow」ボタンから手動実行できるようにする
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: ライブラリをインストール
        run: python -m pip install -r requirements.txt

      - name: ニュースを取得してLINEへ送信
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python morning_news.py
